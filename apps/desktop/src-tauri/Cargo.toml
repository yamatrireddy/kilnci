# SPDX-License-Identifier: Apache-2.0
[package]
name = "kiln-desktop"
version = "0.1.0"
description = "Kiln desktop app"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "kiln_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"
subtle = "2.6.1"
open = "5.4.4"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
