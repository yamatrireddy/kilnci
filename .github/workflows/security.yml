# SPDX-License-Identifier: Apache-2.0
#
# Security gates for every PR and push to main, plus a weekly full scan.
#
# Every `uses:` is pinned to a full commit SHA and container images to a digest;
# Renovate keeps them updated. Scanner invocations live in the Makefile so
# `make security` locally runs exactly what CI runs.

name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly full scan, Monday 03:00 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: tools/go.sum
      - run: make sec-gitleaks

  go-security:
    name: gosec + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # Tool versions are pinned in tools/go.mod (no @latest installs in CI).
      - name: govulncheck
        run: make sec-govulncheck
      - name: gosec
        run: make sec-gosec

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.177.0@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >
          semgrep scan --error
          --config p/owasp-top-ten
          --config p/golang
          --config p/typescript
          --config p/react
          --config .semgrep/
          --exclude '**/*_gen.go' --exclude '**/*.pb.go' --exclude 'packages/api-client/src/gen' --exclude tools

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

  dependencies:
    name: dependency vulns + licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: tools/go.sum
      - name: osv-scanner
        run: make sec-osv
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: pnpm audit
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level high
      - name: cargo audit
        working-directory: apps/desktop/src-tauri
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: license allowlist
        run: make license-check

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0

  # pnpm enforces minimumReleaseAge only when resolving; a frozen-lockfile install
  # trusts the lockfile. This gate rejects PRs whose lockfile adds package
  # versions published to npm less than 7 days ago (T-48). No secrets, no token.
  lockfile-age:
    name: lockfile release age
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit plus its first parent (the base it merges into).
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: new lockfile entries are at least 7 days old
        run: |
          # HEAD must be the synthetic PR merge commit, so HEAD^1 is exactly the
          # base branch and the diff is exactly what merging would introduce.
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3
          # Run the base branch's copy of the gate so a PR cannot weaken the
          # check that judges it. The PR's copy is used only when the base has
          # none, i.e. for the PR that introduces the gate.
          gate="$RUNNER_TEMP/check-lockfile-age.mjs"
          if git cat-file -e HEAD^1:scripts/check-lockfile-age.mjs 2>/dev/null; then
            git show HEAD^1:scripts/check-lockfile-age.mjs > "$gate"
          else
            echo "::warning::base has no lockfile age gate; using the PR's copy (bootstrap)"
            cp scripts/check-lockfile-age.mjs "$gate"
          fi
          node "$gate" --base HEAD^1
      # Tests for the PR's copy of the gate (what takes effect once merged).
      - name: gate unit tests
        run: node --test "scripts/*.test.mjs"

  iac-and-images:
    name: trivy (config + fs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy config (Dockerfiles, Helm, compose) + filesystem vulns
        run: make sec-trivy

  workflow-lint:
    name: actionlint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: actionlint
        run: make lint-workflows
      - name: zizmor (workflow security audit)
        run: |
          pipx install zizmor==1.24.0
          zizmor .github/workflows
