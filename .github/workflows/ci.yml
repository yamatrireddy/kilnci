# SPDX-License-Identifier: Apache-2.0
#
# Build, lint, test, and coverage for every PR and push to main.
# Actions are pinned to full commit SHAs; Renovate keeps them updated.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (generate, lint, test, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d8703cd7fba306b9fec9268ecedfa8a966846c053036a60e3635791957eb2f66
        env:
          POSTGRES_USER: kiln
          POSTGRES_DB: kiln
          POSTGRES_HOST_AUTH_METHOD: trust # ephemeral CI container, no network exposure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kiln" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            server/go.sum
            tools/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: generated code is up to date
        run: |
          make generate
          git diff --exit-code -- server packages/api-client
      - run: make lint-go lint-workflows
      - run: make test-go
      - run: make test-integration
        env:
          KILN_TEST_DATABASE_URL: postgres://kiln@localhost:5432/kiln?sslmode=disable
      - run: make coverage

  web:
    name: web + desktop frontend (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make lint-ts
      - run: make test-ts
      - run: pnpm --filter web build

  desktop:
    name: desktop (clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - name: system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: make lint-rust
      - working-directory: apps/desktop/src-tauri
        run: cargo test --locked
